# מעבדת מחקר: בדיקת שיטות מסחר על שנתיים של נתוני XAU/USD מ-Dukascopy
name: research
on:
  workflow_dispatch:
    inputs:
      months: {description: "חודשים אחורה", default: "24"}
      only: {description: "שיטות (מופרד בפסיקים, ריק = הכל)", default: ""}
      cost: {description: "עלות לעסקה בדולרים", default: "0.35"}
  push:
    paths: ["research/**", "app/strategy.py", "app/analysis.py", ".github/workflows/research.yml"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt pyarrow
      - uses: actions/cache@v4
        with:
          path: research/cache
          key: duka-v1-${{ github.run_id }}
          restore-keys: duka-v1-
      - name: diagnose data sources
        continue-on-error: true
        run: |
          for u in https://datafeed.dukascopy.com/datafeed/XAUUSD/2026/08/03/BID_candles_min_1.bi5 \
                   http://datafeed.dukascopy.com/datafeed/XAUUSD/2026/08/03/BID_candles_min_1.bi5 \
                   https://www.dukascopy.com/datafeed/XAUUSD/2026/08/03/BID_candles_min_1.bi5 \
                   "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=5m&range=5d" \
                   "https://stooq.com/q/d/l/?s=xauusd&i=5" \
                   "https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=5min&outputsize=2"; do
            echo "$u -> $(curl -s -o /tmp/o -w '%{http_code} %{size_download}B %{time_total}s' --max-time 20 -A 'Mozilla/5.0' "$u")"
          done
      - name: run
        run: python -m research.run --months "${{ inputs.months || '24' }}" --cost "${{ inputs.cost || '0.35' }}" --only "${{ inputs.only }}"
