# מעבדת מחקר: בדיקת שיטות מסחר על שנתיים של נתוני XAU/USD מ-Dukascopy
name: research
on:
  workflow_dispatch:
    inputs:
      months: {description: "חודשים אחורה", default: "24"}
      only: {description: "שיטות (מופרד בפסיקים, ריק = הכל)", default: ""}
      cost: {description: "עלות לעסקה בדולרים", default: "0.35"}
      flags: {description: "מצבים נוספים (--ml / --scan)", default: "--search 20000"}
  push:
    paths: ["research/**", "app/strategy.py", "app/analysis.py", ".github/workflows/research.yml"]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt pyarrow scikit-learn
      - uses: actions/cache@v4
        with:
          path: research/cache
          key: hd-v1-${{ github.run_id }}
          restore-keys: hd-v1-
      - name: diagnose data sources
        continue-on-error: true
        run: |
          for u in "https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/xauusd/2025" \
                   "https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/xauusd/2026/9"; do
            echo "$u -> $(curl -s -o /tmp/o -w '%{http_code} %{size_download}B %{time_total}s' --max-time 20 -A 'Mozilla/5.0' "$u")"
          done
      - name: run
        run: python -m research.run --months "${{ inputs.months || '24' }}" --cost "${{ inputs.cost || '0.35' }}" --only "${{ inputs.only }}" ${{ inputs.flags || '--check' }}
