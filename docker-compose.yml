# הרצה על שרת משלך (למשל Oracle Cloud): האפליקציה + Caddy שמנפיק HTTPS אוטומטית
name: gold-analyzer

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    mem_limit: 400m   # תקרה: גם אם משהו משתבש, הבוט הזה לא יחנוק את השרת
    cpus: 0.5
    environment:
      - DB_PATH=/data/bot.db
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    mem_limit: 100m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
