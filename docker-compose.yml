# הרצה על שרת משלך (למשל Oracle Cloud): האפליקציה + Caddy שמנפיק HTTPS אוטומטית
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/bot.db
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
