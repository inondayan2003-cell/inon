<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nails · הדף לא נמצא</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --bg: #f8f4f1; --text: #2b1b16; --muted: #76665e; --primary: #5a3426; --ink: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15100e; --text: #f4ece8; --muted: #b1a29a; --primary: #e3c6ba; --ink: #2b1b16; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: "Heebo", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    img { width: 84px; height: 84px; border-radius: 22px; }
    .code { font-family: "Frank Ruhl Libre", serif; font-size: 3.4rem; font-weight: 700; margin: 14px 0 0; color: var(--primary); }
    h1 { font-family: "Frank Ruhl Libre", serif; margin: 0 0 6px; font-size: 1.5rem; }
    p { color: var(--muted); margin: 0 0 22px; }
    a { display: inline-block; border-radius: 999px; padding: 12px 26px; background: var(--primary); color: var(--ink);
      font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <p class="code">404</p>
    <h1>הדף הזה לא נמצא</h1>
    <p>אולי הקישור ישן, או שהעסק כבר לא באפליקציה.</p>
    <a href="/">חזרה לדף הבית</a>
  </main>
</body>
</html>
